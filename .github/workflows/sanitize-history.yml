name: One-time Git History Sanitization

on:
  push:
    paths:
      - ".history-cleanup-trigger"

permissions:
  contents: write

jobs:
  sanitize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install git-filter-repo
        run: python -m pip install git-filter-repo

      - name: Remove sensitive legacy paths from all history
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git filter-repo --force --invert-paths \
            --path ChickenHatPlatform_705.zip \
            --path ChickenHatPlatform-705/ \
            --path replit.md
          git remote add origin "https://github.com/${REPO}.git"
          git rm -f .history-cleanup-trigger .github/workflows/sanitize-history.yml
          git commit -m "Complete one-time history sanitization"
          git push --force origin HEAD:main
