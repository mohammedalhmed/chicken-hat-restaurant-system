name: Extract Chicken Hat Source

on:
  workflow_dispatch:
  push:
    paths:
      - "ChickenHatPlatform_705.zip"
      - ".github/workflows/unzip-chickenhat.yml"

permissions:
  contents: write

jobs:
  extract-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract source archive
        run: |
          rm -rf ChickenHatPlatform-705
          unzip -q ChickenHatPlatform_705.zip -d ./
          rm -rf ChickenHatPlatform-705/.git
          rm -f ChickenHatPlatform-705/replit.md
          find ChickenHatPlatform-705 -type f \( -name ".env" -o -name ".env.local" -o -name ".env.production" -o -name ".env.development" \) -delete

      - name: Commit extracted source
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Extract Chicken Hat source for repository browsing"
          branch: ${{ github.ref_name }}
          file_pattern: "ChickenHatPlatform-705"
